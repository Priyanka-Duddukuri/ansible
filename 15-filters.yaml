- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: Linux, Shell, Ansible, Terraform
    full_name: prudhvi and priyanka has kids juhith and harshika
    tagMap:
      name: Ansible
      project: roboshop
      environment: dev
    tagsList: [
        {
            "key": "name",
            "value": "Ansible"
        },
        {
            "key": "project",
            "value": "roboshop"
        },
        {
            "key": "environment",
            "value": "dev"
        }
    ]

  tasks:
  - name: Convert string to list
    debug:
      msg: "Topics are: {{ topics | split(',') }}"

  - name: set default value
    debug:
      msg: "Hi {{ GREETING | default('Good Morning') }}"

  - name: convert map to list
    debug:
      msg: "{{ tagMap | dict2items  }}"

  - name: convert map to list
    debug:
      msg: "{{ tagsList | items2dict  }}"

  - name: convert to uppercase
    debug:
      msg: "{{ full_name | upper }}"

  - name: convert to uppercase
    debug:
      msg: "{{ full_name | lower }}"


